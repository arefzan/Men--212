<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Menú 212 Lounge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap">
<style id="s">
/* Carta de noche: blanco limpio, azul 212 y bronce. Títulos en serif fina, platos en sans legible. Portada con foto, tres puertas (Comida, Bebidas, Postres y café) y una barra fija para moverse. */
:root{
  --bg:#ffffff; --ink:#15161c; --soft:#666a76; --faint:#a3a6b0; --rule:#ececef; --chip:#f4f4f6;
  --navy:#17204b; --on-navy:#f5f2ea; --bronze:#a2733a; --bronze-hi:#e2bf88;
  --serif:"Cormorant Garamond","Didot","Bodoni 72",Georgia,serif;
  --sans:"Jost","Futura","Avenir Next","Segoe UI",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0f1f;--ink:#f1efe9;--soft:#a5a8b6;--faint:#686c7f;--rule:#1f2440;--chip:#161b34;--navy:#e9e3d6;--on-navy:#14193a;--bronze:#d4aa6d;--bronze-hi:#ecca94;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c0f1f;--ink:#f1efe9;--soft:#a5a8b6;--faint:#686c7f;--rule:#1f2440;--chip:#161b34;--navy:#e9e3d6;--on-navy:#14193a;--bronze:#d4aa6d;--bronze-hi:#ecca94;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--bronze);outline-offset:3px}
.wrap{max-width:660px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.caps{font-size:11px;letter-spacing:.3em;text-transform:uppercase;font-weight:500}

/* Portada (siempre oscura: es una foto) */
header{position:relative;overflow:hidden;isolation:isolate;background:#17204b;color:#fff;padding-top:env(safe-area-inset-top,0px)}
header .ph{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center 45%;transform:scale(1.08);animation:zoom 2.4s var(--ease) forwards}
header::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(12,16,40,.55) 0%,rgba(12,16,40,.3) 45%,rgba(12,16,40,.9) 100%)}
header .wrap{min-height:min(500px,74vh);padding-block:52px 30px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:28px;text-align:center}
.top{display:flex;flex-direction:column;align-items:center;gap:16px}
.logo{width:150px;height:auto;filter:invert(1) drop-shadow(0 4px 18px rgba(0,0,0,.45));animation:rise 1s var(--ease) both}
.place{font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:#e2bf88;animation:rise 1s .1s var(--ease) both}
.bottom{display:flex;flex-direction:column;align-items:center;gap:20px}
.links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;animation:rise 1s .2s var(--ease) both}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;font-size:14.5px;font-weight:400;text-decoration:none;border:1px solid rgba(255,255,255,.35);color:#fff;background:rgba(255,255,255,.08);backdrop-filter:blur(8px)}
.btn.main{background:#fff;color:#17204b;border-color:transparent;font-weight:500}
.btn svg{width:16px;height:16px;flex:0 0 auto}
.down{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.75);text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:8px}
.down::after{content:"";width:1px;height:26px;background:linear-gradient(rgba(255,255,255,.8),transparent)}
@keyframes zoom{to{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}

/* Tres puertas */
.doors{padding-block:34px 6px;text-align:center}
.doors h2{margin:0 0 4px;font-family:var(--serif);font-weight:500;font-size:clamp(34px,8.6vw,44px);line-height:1}
.doors p{margin:0 0 20px;color:var(--soft);font-size:14.5px}
.door-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.door{display:flex;flex-direction:column;gap:10px;text-align:center}
.door i{display:block;aspect-ratio:4/5;max-width:100%;border-radius:16px;background-size:cover;background-position:center;background-color:var(--chip);outline:2px solid transparent;outline-offset:3px;transition:outline-color .3s,transform .4s var(--ease),filter .3s;filter:saturate(.85)}
.door span{font-size:13px;font-weight:400;line-height:1.25;color:var(--soft);transition:color .3s}
.door:hover i{transform:translateY(-2px)}
.door[aria-pressed="true"] i{outline-color:var(--bronze);filter:none}
.door[aria-pressed="true"] span{color:var(--ink);font-weight:500}

/* Barra fija */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--rule);margin-top:26px}
.seg-row{display:flex;align-items:center;gap:10px;padding-top:10px}
.seg{flex:1;min-width:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--chip);border-radius:999px;padding:4px}
.seg button{padding:9px 4px;border-radius:999px;font-size:13.5px;font-weight:400;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .25s,color .25s}
.seg button[aria-selected="true"]{background:var(--navy);color:var(--on-navy);font-weight:500}
.icon{flex:0 0 auto;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--chip)}
.icon svg{width:18px;height:18px}
.chips{display:flex;gap:20px;overflow-x:auto;scrollbar-width:none;padding-block:12px 0;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent);padding-right:30px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;padding-bottom:10px;font-size:14px;color:var(--faint);border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
.chips button.on{color:var(--ink);border-color:var(--bronze)}
.search{padding-block:10px 12px}
.search input{width:100%;border:1px solid var(--rule);border-radius:999px;background:var(--chip);padding:11px 18px;outline:none;font-size:16px}
.search input:focus{border-color:var(--bronze)}
.search input::placeholder{color:var(--faint)}

/* Carta */
main{min-height:70vh;padding-bottom:20px}
.fade{animation:fade .45s var(--ease) both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.group{display:flex;align-items:center;gap:14px;margin:56px 0 0;color:var(--bronze)}
.group::before,.group::after{content:"";flex:1;height:1px;background:var(--rule)}
.cat{scroll-margin-top:calc(118px + env(safe-area-inset-top,0px));padding-top:42px}
.cat h3{margin:0;font-family:var(--serif);font-weight:600;font-size:clamp(28px,7vw,34px);line-height:1.05;text-wrap:balance}
.cat .note{margin:6px 0 0;color:var(--soft);font-size:14px;font-style:normal}
.cat .rule{display:block;width:34px;height:2px;background:var(--bronze);margin:12px 0 4px}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 18px;padding:16px 0;border-bottom:1px solid var(--rule)}
.it:last-child{border-bottom:0}
.it .nm{font-weight:400;font-size:17px;line-height:1.35}
.pr{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500;font-size:16.5px;color:var(--bronze)}
.it .ds{grid-column:1;color:var(--soft);font-size:14.5px;line-height:1.45;max-width:52ch}
.it .opts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.it .opts span{font-size:13.5px;background:var(--chip);border-radius:999px;padding:5px 12px;color:var(--soft)}
.it .opts b{color:var(--bronze);font-weight:500;font-variant-numeric:tabular-nums;margin-left:6px}
.plain{display:flex;flex-wrap:wrap;gap:8px;padding-top:12px}
.plain span{font-size:14px;background:var(--chip);border-radius:999px;padding:7px 14px}
.empty{color:var(--soft);padding:60px 0;text-align:center}
.lbl{display:block;margin-top:4px;color:var(--faint)}
mark{background:none;color:var(--bronze);font-weight:500}
.next{display:flex;justify-content:center;padding-top:44px}
.next button{border:1px solid var(--rule);border-radius:999px;padding:12px 22px;font-size:14.5px;display:inline-flex;gap:8px;align-items:center}
.next button:hover{border-color:var(--bronze)}

footer{margin-top:56px;background:#17204b;color:#f5f2ea}
footer .wrap{padding-block:44px calc(48px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
footer img{width:84px;filter:invert(1)}
footer p{margin:0;font-size:13.5px;opacity:.72}
.num{font-variant-numeric:tabular-nums;user-select:all;letter-spacing:.06em;font-size:18px;font-weight:400;color:#e2bf88}
.admin-link{color:inherit;opacity:.45;font-size:12px;text-decoration:underline;text-underline-offset:3px;margin-top:10px}

/* Panel */
.panel{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto}
.p-head{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top,0px)}
.p-head .wrap{display:flex;align-items:center;gap:10px;padding-block:12px;flex-wrap:wrap}
.p-head h2{margin:0;font-family:var(--serif);font-weight:600;font-size:26px;flex:1;min-width:140px}
.status{font-size:13px;color:var(--soft);width:100%}
.status.ok{color:#2f8a52}.status.err{color:#c0503e}
.p-body{padding-block:16px 60px}
.card{border:1px solid var(--rule);border-radius:14px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-weight:500}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.foto{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--soft)}
.foto .th{aspect-ratio:4/3;max-width:100%;border-radius:10px;background:var(--rule) center/cover no-repeat}
.foto .th.lg{background-size:contain}
.foto label{cursor:pointer;text-align:center}
.foto input{display:none}
.qrbox{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.qrbox canvas{width:180px;height:180px;max-width:100%;background:#fff;border-radius:10px;padding:8px}
.qrbox .acts{display:flex;flex-direction:column;gap:8px;min-width:0}
.qrbox code{word-break:break-all;font-size:13px}
.duo{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 10px}.duo b{font-size:20px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:13px;color:var(--soft)}
.field input{background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;color:var(--ink)}
details.sec{border:1px solid var(--rule);border-radius:14px;margin-bottom:10px}
details.sec>summary{padding:14px 16px;font-family:var(--serif);font-size:22px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";color:var(--bronze);font-family:var(--sans)}
details.sec[open]>summary::after{content:"–"}
.pcat{padding:0 14px 14px}
.pcat h4{margin:14px 0 8px;color:var(--soft)}
.prow{border:1px solid var(--rule);border-radius:10px;padding:10px;margin-bottom:8px;display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:8px}
.prow.off{opacity:.45}
.prow input,.prow textarea{background:var(--chip);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;width:100%;min-width:0;color:var(--ink)}
.prow textarea{grid-column:1/-1;resize:vertical;min-height:40px;font-size:14px}
.prow .pp{display:flex;align-items:center;gap:4px;color:var(--bronze)}
.prow .optrow{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.prow .optrow label{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--soft)}
.prow .optrow input{width:76px}
.prow .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.sm{border:1px solid var(--rule);border-radius:6px;padding:6px 11px;font-size:13px}
.sm:disabled{opacity:.3}
.sm.warn{border-color:#c0503e;color:#c0503e}
.addrow{border:1px dashed var(--faint);color:var(--soft);border-radius:8px;padding:9px 12px;width:100%}
.save{border-radius:8px;padding:10px 16px;font-weight:500;background:var(--navy);color:var(--on-navy)}
.save:disabled{opacity:.35}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

        h+='<div class="acts"><button class="sm" data-act="top" data-i="'+id+'"'+(ii===0?' disabled':'')+'>Poner primero</button><button class="sm" data-act="up" data-i="'+id+'"'+(ii===0?' disabled':'')+' aria-label="Subir">↑</button><button class="sm" data-act="down" data-i="'+id+'"'+(ii===c.items.length-1?' disabled':'')+' aria-label="Bajar">↓</button><button class="sm" data-act="hide" data-i="'+id+'">'+(it.x?'Mostrar en el menú':'Agotado / ocultar')+'</button><button class="sm warn" data-act="del" data-i="'+id+'">'+(delArm===id?'Toca otra vez para borrar':'Borrar')+'</button></div></div>';
      });
      h+='<button class="addrow" data-act="new" data-i="'+si+'-'+ci+'">+ Agregar en '+esc(c.name)+'</button></div>';
    });
    h+='</details>';
  });
  $("#panel").innerHTML=h+'</div></div>';
  const p=$(".panel");if(p)p.scrollTop=y;
}
function at(id){const [a,b,c]=id.split("-").map(Number);return{i:c,cat:E.sections[a].cats[b],it:E.sections[a].cats[b].items[c]}}
function mark(){if(!dirty){dirty=true;const b=$("#p-save");if(b)b.disabled=false;const s=$(".status");if(s){s.textContent="Tienes cambios sin publicar.";s.className="status"}}}
const num=v=>{v=String(v).replace(",",".").replace(/[^\d.]/g,"");return v===""?null:Math.round(parseFloat(v)*100)/100};
document.addEventListener("input",e=>{
  if(!E)return;const el=e.target;
  if(el.id==="e-wa"){E.wa=el.value.replace(/\D/g,"");mark();return}
  if(el.id==="e-ig"){E.ig=el.value.replace(/^@/,"").trim();mark();return}
  if(el.id==="e-note"){E.note=el.value;mark();return}
  if(!el.dataset.f)return;const r=at(el.dataset.i);
  if(el.dataset.f==="n")r.it.n=el.value;
  if(el.dataset.f==="d")r.it.d=el.value;
  if(el.dataset.f==="p")r.it.p=num(el.value);
  if(el.dataset.f==="o")r.it.o[+el.dataset.oi][1]=num(el.value)??0;
  mark();
});
document.addEventListener("change",e=>{const k=e.target.dataset&&e.target.dataset.photo;if(k&&E&&e.target.files[0])uploadPhoto(k,e.target.files[0])});
document.addEventListener("click",async e=>{
  if(e.target.closest("#l-close")){closePanel();return}
  if(!e.target.closest("#l-go"))return;
  const msg=document.getElementById("l-msg");
  const {error}=await sb.auth.signInWithPassword({email:document.getElementById("l-em").value.trim(),password:document.getElementById("l-pw").value});
  if(error){msg.textContent="Correo o contraseña incorrectos.";return}
  session=(await sb.auth.getSession()).data.session;
  if(!await isAdmin()){await sb.auth.signOut();session=null;msg.textContent="Esta cuenta no tiene acceso al panel.";return}
  canEdit=true;const a=$("#adm");if(a)a.hidden=false;openPanel();
});
document.addEventListener("click",async e=>{
  if(!E)return;const t=e.target.closest("#p-close,#p-out,#qr-dl,#qr-cp,#p-save,[data-act]");if(!t)return;
  if(t.id==="p-close"){closePanel();return}
  if(t.id==="qr-dl"){downloadQR();return}
  if(t.id==="qr-cp"){try{await navigator.clipboard.writeText(MENU_URL);t.textContent="Copiado"}catch(_){t.textContent=MENU_URL}return}
  if(t.id==="p-out"){await sb.auth.signOut();session=null;canEdit=false;const a=$("#adm");if(a)a.hidden=true;closePanel();return}
  if(t.id==="p-save"){publish();return}
  const act=t.dataset.act,id=t.dataset.i;
  if(act==="top"||act==="up"||act==="down"){const r=at(id),a=r.cat.items,i=r.i,j=act==="top"?0:act==="up"?i-1:i+1;if(j<0||j>=a.length||j===i)return;const [it]=a.splice(i,1);a.splice(j,0,it);delArm=null;mark();drawPanel();return}
  if(act==="hide"){const r=at(id);if(r.it.x)delete r.it.x;else r.it.x=true;mark();drawPanel();return}
  if(act==="del"){if(delArm!==id){delArm=id;drawPanel();return}const r=at(id);r.cat.items.splice(r.i,1);delArm=null;mark();drawPanel();return}
  if(act==="new"){const [a,b]=id.split("-").map(Number);const arr=E.sections[a].cats[b].items;arr.push({n:"Nuevo plato",d:"",p:null});mark();drawPanel();const inp=document.getElementById("n-"+a+"-"+b+"-"+(arr.length-1));if(inp){inp.focus();inp.select()}return}
});
function buildDoc(data){
  const json=JSON.stringify(data).replace(/</g,"\\u003c");
  return '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'+SRC.head+'</head><body>'+SRC.imgs+'<script type="application/json" id="menu-data">'+json+'<\/script><div id="app"></div>'+SRC.main+'</body></html>';
}
function shrink(file,png){return new Promise((ok,no)=>{const img=new Image();img.onload=()=>{const m=1600,r=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(),png?"image/png":"image/jpeg",.85);URL.revokeObjectURL(img.src)};img.onerror=no;img.src=URL.createObjectURL(file)})}
async function uploadPhoto(k,file){
  upKey=k;drawPanel("Subiendo foto…");
  try{
    const png=k==="logo";const blob=await shrink(file,png);
    const path=k+"-"+Date.now()+(png?".png":".jpg");
    const {error}=await sb.storage.from("fotos").upload(path,blob,{contentType:blob.type,cacheControl:"31536000"});
    if(error)throw error;
    const url=sb.storage.from("fotos").getPublicUrl(path).data.publicUrl;
    E.photos=Object.assign({},E.photos,{[k]:url});upKey=null;dirty=true;drawPanel("Foto lista. Toca Guardar y publicar para que la vean los clientes.");
  }catch(e){upKey=null;drawPanel("No se pudo subir la foto. Prueba con otra imagen.","err")}
}
async function isAdmin(){
  if(!session)return false;
  const {data}=await sb.from("admins").select("id").eq("id",session.user.id).maybeSingle();
  return !!data;
}
function drawQR(){
  const c=document.getElementById("qrc");if(!c||!window.qrcode)return;
  const q=qrcode(0,"M");q.addData(QR_URL);q.make();
  const n=q.getModuleCount(),m=4,s=Math.floor(c.width/(n+m*2)),off=Math.floor((c.width-s*n)/2),x=c.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.fillStyle="#000";
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect(off+k*s,off+r*s,s,s);
}
function downloadQR(){
  if(!window.qrcode)return;
  const q=qrcode(0,"M");q.addData(QR_URL);q.make();
  const n=q.getModuleCount(),s=20,m=4,c=document.createElement("canvas");c.width=c.height=(n+m*2)*s;
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.fillStyle="#000";
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect((k+m)*s,(r+m)*s,s,s);
  const a=document.createElement("a");a.download="QR-menu-212.png";a.href=c.toDataURL("image/png");document.body.appendChild(a);a.click();a.remove();
}
async function publish(){
  if(!sb||!session){drawPanel("Inicia sesión para guardar.","err");return}
  saving=true;drawPanel("Guardando…");
  const {error}=await sb.from("menu_state").upsert({id:1,data:E,updated_at:new Date().toISOString()});
  if(error){saving=false;drawPanel("No se pudo guardar. Revisa la conexión o vuelve a entrar.","err");return}
  D=E;saving=false;dirty=false;drawPanel("Guardado. Los clientes ya ven el menú actualizado.","ok");
}
function drawLogin(){
  $("#panel").innerHTML='<div class="panel" role="dialog" aria-label="Entrar"><div class="p-head"><div class="wrap"><h2>Entrar al panel</h2><button class="sm" id="l-close">Cerrar</button></div></div><div class="wrap"><div class="card"><label class="field">Correo<input id="l-em" type="email" autocomplete="username"></label><label class="field">Contraseña<input id="l-pw" type="password" autocomplete="current-password"></label><button class="save" id="l-go">Entrar</button><p class="status" id="l-msg"></p></div></div></div>';
  document.body.style.overflow="hidden";
}
async function loadStats(){
  if(!sb||!session)return;
  const since=new Date(Date.now()-30*864e5).toISOString().slice(0,10);
  const {data,error}=await sb.from("visits").select("day,device,source").gte("day",since).limit(10000);
  if(error){statsHtml="No pude cargar las visitas.";}
  else{
    const porDia={},porTipo={},unicos=new Set();let qr=0,ln=0;
    data.forEach(v=>{if(v.source==='qr')qr++;else ln++;porDia[v.day]=(porDia[v.day]||0)+1;const t=v.device.split("|")[0];porTipo[t]=(porTipo[t]||0)+1;unicos.add(v.device)});
    const filas=Object.keys(porDia).sort().reverse().slice(0,14).map(d=>'<li>'+d+': <b>'+porDia[d]+'</b></li>').join("")||'<li>Sin visitas aún</li>';
    statsHtml='<h3>Visitas (últimos 30 días)</h3><div class="duo"><span>Por QR: <b>'+qr+'</b></span><span>Por link: <b>'+ln+'</b></span></div><p>Total: <b>'+data.length+'</b> · Dispositivos: <b>'+unicos.size+'</b> · Móvil: '+(porTipo.movil||0)+' · Escritorio: '+(porTipo.escritorio||0)+'</p><ul class="stats">'+filas+'</ul>';
  }
  const el=document.getElementById("stats");if(el)el.innerHTML=statsHtml;
}
async function logVisit(){
  let id="";
  try{id=localStorage.getItem("dev212")||"";if(!id){id=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("dev212",id)}}catch(e){}
  if(sessionStorage.getItem("visita212"))return;
  sessionStorage.setItem("visita212","1");
  const tipo=/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)?"movil":"escritorio";
  const r=await sb.from("visits").insert({device:tipo+"|"+id,source:ORIGEN});
  if(r.error)await sb.from("visits").insert({device:tipo+"|"+id});
}



shell();render();
(async()=>{
  if(!window.supabase)return;
  sb=window.supabase.createClient(SB_URL,SB_KEY);
  try{
    const {data}=await sb.from("menu_state").select("data").eq("id",1).maybeSingle();
    if(data&&data.data&&data.data.sections&&data.data.sections.length){D=data.data;shell();render()}
  }catch(e){}
  try{await logVisit()}catch(e){}
  try{
    const {data:s}=await sb.auth.getSession();session=s.session;
    if(session&&await isAdmin()){canEdit=true;const a=$("#adm");if(a)a.hidden=false}else if(session){await sb.auth.signOut();session=null}
  }catch(e){}
  sb.auth.onAuthStateChange((_e,s)=>{session=s;if(!s){canEdit=false;const a=$("#adm");if(a)a.hidden=true}});
  if(location.hash==="#panel")openPanel();
})();
})();
</script>
